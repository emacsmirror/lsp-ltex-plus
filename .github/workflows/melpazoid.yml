---

# The checks MELPA's reviewers run, on every push: melpazoid
# <https://github.com/riscy/melpazoid> byte-compiles the package as
# package-build would, runs package-lint and checkdoc over it, and looks
# for the habits MELPA asks packages to avoid.
#
# `make check' already byte-compiles and runs checkdoc, and `make lint'
# runs package-lint -- against the Emacs and the package-lint of this
# machine.  This job runs them against MELPA's own recipe and a current
# checkout of package-lint, which is what caught a symbol newer than the
# declared Emacs floor before 1.0.0.
#
# It fails the build only on errors; the notes it prints about
# `add-hook' at load time are about hooks this package defines itself.

name: melpazoid

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  melpazoid:
    runs-on: ubuntu-latest
    name: MELPA checks
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install melpazoid
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update && sudo apt-get install --yes emacs
          emacs --version
          git clone https://github.com/riscy/melpazoid.git ~/melpazoid
          pip install ~/melpazoid

      - name: Run melpazoid
        env:
          LOCAL_REPO: ${{ github.workspace }}
          # The recipe MELPA itself builds from, so that what is checked
          # here is what MELPA ships.
          RECIPE: (lsp-ltex-plus :fetcher github :repo "ltex-plus/emacs-ltex-plus")
          # The package is on MELPA already; without this, melpazoid
          # reports its presence there as a problem.
          EXIST_OK: 'true'
        run: make -C ~/melpazoid
